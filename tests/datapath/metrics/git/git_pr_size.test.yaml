spec_version: 1
description: >
  Metric: git.pr_size — typical diff size per pull request, #3066.
  How it's computed (bronze → silver → gold):
    • bronze: pull requests, and per-source diff totals — GitHub reports one
      total per request, Bitbucket reports one row per changed FILE and carries
      the parent request's last-update stamp on each, GitLab reports no diff
      totals for a request at all
    • silver: one class row per request, whose line counts are null when the
      source never reported them and a number when it did
    • gold:   lines added plus lines removed, one value per request, dated by
      the day the request was OPENED — the state it reached is irrelevant, so an
      open, a merged and a closed-unmerged request all contribute
    • serve:  quantileExact(0.5) over the period's values

  A request whose line counts were never collected contributes nothing. A
  request whose counts WERE collected and are zero contributes a real zero: it
  is an observed diff of no lines, not an absence, and the class columns are
  nullable precisely to keep the two apart. #3066

  Bitbucket's per-file rows accumulate: the key is the file path, so a
  ReplacingMergeTree replaces a file's row and never removes one. A request
  re-collected after a rebase dropped a file therefore holds that file's row
  for ever, and only the parent's last-update stamp says which rows belong to
  the diff the request has NOW. Size is the newest stamp's rows, whole — taking
  each file's own newest row instead keeps the dropped file, since that file has
  no newer row to displace it. #3066

  alice opens five requests sized 12, 24, 36, 48 and 100 lines. Expected median
  = 36: quantileExact picks the sorted element at index floor(0.5 x 5) = 2, and
  a mean (44) fails it. The 2026-12-01 bucket holds the EVEN set
  [12, 24, 36, 48] and serves 36 — the upper of the two middle values, not
  their average 30.
  carol opens three sized 0, 10 and 30, so her median is 10 while dropping the
  observed zero would serve 30.
  heidi's Bitbucket requests: one summing three current file rows to 40, one
  whose current diff is 30 lines beside a stale 70-line row, and one whose
  diffstat was never collected at all.
  bob's GitLab request reaches the metric with no size, which its own created
  count proves is absence of a line count and not absence of the request.

  Cases: the median across views and the even-bucket boundary; a collected zero
  is a value; GitLab reports no size while still reporting the request;
  Bitbucket sums the current file rows, ignores a stale one, and stays silent
  with no rows at all; the window holding every close and merge holds no
  creation; an empty window.

identity_accounts:
  # Bitbucket exposes no author address on a request, and GitLab exposes one
  # only to an admin-scoped token, so both reach a person through the account.
  - {source_type: bitbucket, source_id: bitbucket-test, account_id: "bb-size-01", person: heidi@example.com}
  - {source_type: gitlab, source_id: gitlab-test, account_id: "730", person: bob@example.com}

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol
    - $ref: ../templates/people.yaml#/templates/heidi

  bronze_github.pull_requests:
    # alice: four opened on 12-01, one on 12-02, every close and merge landing
    # days later — so a window over the closes must hold nothing.
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-a1, id: 501, number: 501, author_login: alice, created_at: "2026-12-01T08:00:00Z", closed_at: "2026-12-05T10:00:00Z", merged_at: "2026-12-05T10:00:00Z", merge_commit_sha: ps-merge-a1}
    # Still open: no close, no merge, and it counts all the same.
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-a2, id: 502, number: 502, state: open, author_login: alice, created_at: "2026-12-01T09:00:00Z"}
    # Closed without ever merging: also counts.
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-a3, id: 503, number: 503, author_login: alice, created_at: "2026-12-01T10:00:00Z", closed_at: "2026-12-04T10:00:00Z"}
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-a4, id: 504, number: 504, author_login: alice, created_at: "2026-12-01T11:00:00Z", closed_at: "2026-12-06T10:00:00Z", merged_at: "2026-12-06T10:00:00Z", merge_commit_sha: ps-merge-a4}
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-a5, id: 505, number: 505, author_login: alice, created_at: "2026-12-02T08:00:00Z", closed_at: "2026-12-07T10:00:00Z", merged_at: "2026-12-07T10:00:00Z", merge_commit_sha: ps-merge-a5}
    # carol: the zero-line request sits between her other two, so the median
    # moves if it is dropped.
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-c1, id: 511, number: 511, author_login: carol, created_at: "2026-12-01T08:00:00Z", closed_at: "2026-12-05T10:00:00Z", merged_at: "2026-12-05T10:00:00Z", merge_commit_sha: ps-merge-c1}
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-c2, id: 512, number: 512, author_login: carol, created_at: "2026-12-01T09:00:00Z", closed_at: "2026-12-05T11:00:00Z", merged_at: "2026-12-05T11:00:00Z", merge_commit_sha: ps-merge-c2}
    - {$ref: ../templates/git_activity.yaml#/templates/pull_request, unique_key: ps-c3, id: 513, number: 513, author_login: carol, created_at: "2026-12-01T10:00:00Z", closed_at: "2026-12-05T12:00:00Z", merged_at: "2026-12-05T12:00:00Z", merge_commit_sha: ps-merge-c3}

  bronze_github.pull_request_diff_stats:
    # GitHub reports a request's totals in one row, and staging reads the
    # author's address from here and nowhere else.
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-a1, pull_number: 501, additions: 10, deletions: 2, author_email: alice@example.com}
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-a2, pull_number: 502, additions: 20, deletions: 4, author_email: alice@example.com}
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-a3, pull_number: 503, additions: 30, deletions: 6, author_email: alice@example.com}
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-a4, pull_number: 504, additions: 40, deletions: 8, author_email: alice@example.com}
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-a5, pull_number: 505, additions: 80, deletions: 20, author_email: alice@example.com}
    # Collected, and both counts are zero: an observed diff of no lines. The
    # shape a rename-only or mode-only request leaves.
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-c1, pull_number: 511, additions: 0, deletions: 0, author_email: carol@example.com}
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-c2, pull_number: 512, additions: 8, deletions: 2, author_email: carol@example.com}
    - {$ref: ../templates/git_activity.yaml#/templates/diff_stat, unique_key: ps-ds-c3, pull_number: 513, additions: 25, deletions: 5, author_email: carol@example.com}

  bronze_gitlab.projects:
    - {$ref: ../templates/gitlab_git.yaml#/templates/project, unique_key: ps-gl-proj-101}

  bronze_gitlab.users:
    - {$ref: ../templates/gitlab_git.yaml#/templates/user, unique_key: ps-gl-user-bob, id: 730, username: bob-gl-size, name: Bob Beta}

  bronze_gitlab.merge_requests:
    # GitLab has no diff-stat stream for a merge request, so no line count can
    # reach the class row for this one.
    - {$ref: ../templates/gitlab_git.yaml#/templates/merge_request, unique_key: ps-gl-mr-601, iid: 601, id: 96601, author_id: 730, author_username: bob-gl-size, created_at: "2026-12-01T08:00:00Z", merged_at: "2026-12-05T09:00:00Z", merge_commit_sha: ps-gl-merge-601}

  bronze_bitbucket_cloud.pull_requests:
    # Left OPEN on purpose: size ignores the state, and an open request cannot
    # engage the close-time derivation, so nothing here depends on it.
    - {$ref: ../templates/bitbucket_git.yaml#/templates/pull_request, unique_key: "ps-bb-pr:801", repo_full_name: acme/size, id: 801, state: OPEN, author_display_name: Heidi Eta, author_account_id: bb-size-01, created_on: "2026-12-11T08:00:00Z", updated_on: "2026-12-11T09:00:00Z"}
    - {$ref: ../templates/bitbucket_git.yaml#/templates/pull_request, unique_key: "ps-bb-pr:802", repo_full_name: acme/size, id: 802, state: OPEN, author_display_name: Heidi Eta, author_account_id: bb-size-01, created_on: "2026-12-12T08:00:00Z", updated_on: "2026-12-12T12:00:00Z"}
    # No diffstat row exists for this one: the size was never collected.
    - {$ref: ../templates/bitbucket_git.yaml#/templates/pull_request, unique_key: "ps-bb-pr:803", repo_full_name: acme/size, id: 803, state: OPEN, author_display_name: Heidi Eta, author_account_id: bb-size-01, created_on: "2026-12-13T08:00:00Z", updated_on: "2026-12-13T09:00:00Z"}

  bronze_bitbucket_cloud.pull_request_diffstat:
    # 801 — three files, all carrying the request's current update stamp:
    # 6 + 12 + 22 = 40 lines.
    - {$ref: ../templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ps-bb-ds:801:one", repo_full_name: acme/size, pr_id: 801, file_path: one.py, lines_added: 5, lines_removed: 1, pr_updated_on: "2026-12-11T09:00:00Z"}
    - {$ref: ../templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ps-bb-ds:801:two", repo_full_name: acme/size, pr_id: 801, file_path: two.py, lines_added: 10, lines_removed: 2, pr_updated_on: "2026-12-11T09:00:00Z"}
    - {$ref: ../templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ps-bb-ds:801:three", repo_full_name: acme/size, pr_id: 801, file_path: three.py, lines_added: 20, lines_removed: 2, pr_updated_on: "2026-12-11T09:00:00Z"}
    # 802 — the current diff is kept.py alone, 30 lines, collected when the
    # request last moved.
    - {$ref: ../templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ps-bb-ds:802:kept", repo_full_name: acme/size, pr_id: 802, file_path: kept.py, lines_added: 25, lines_removed: 5, pr_updated_on: "2026-12-12T12:00:00Z"}
    # dropped.py left the diff in a rebase. Its row was written under the
    # earlier stamp and nothing replaces or removes it.
    - {$ref: ../templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ps-bb-ds:802:dropped", repo_full_name: acme/size, pr_id: 802, file_path: dropped.py, lines_added: 70, lines_removed: 0, pr_updated_on: "2026-12-12T09:00:00Z"}
